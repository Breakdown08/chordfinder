#  Файл настроек для управления back-end сервером
[default] # -------------------------------------------------
DEBUG = true
ALLOWED_HOSTS = ['*']
MEDIA_URL = '/media/'
STATIC_URL = '/static/'
ENV_NAME = 'default'

[local] # -------------------------------------------------
DEBUG = true
ALLOWED_HOSTS = ['*']
STATIC_ROOT = '/static/'
STATIC_URL = '/static/'
MEDIA_ROOT = '/media/'
MEDIA_URL = '/api/media/'
ENV_NAME = 'local'

[production] # -------------------------------------------------
DEBUG = false
ALLOWED_HOSTS = ['chordfinder.ru']
STATIC_ROOT = '/static/'
STATIC_URL = '/static/'
MEDIA_ROOT = '/media/'
MEDIA_URL = '/api/media/'
ENV_NAME = 'production'