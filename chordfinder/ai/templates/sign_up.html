{% extends 'base_template.html' %}
{% load static %}

{% block links %}
	<link rel="stylesheet" href="{% static 'frontend/css/vertical_section.css' %}" />
{% endblock %}

{% block content %}
	<section class="vertical_section">
		<div class="login_form">
			<h2>Регистрация</h2>
			<form method="post" id="contactForm" novalidate="novalidate">
				{% csrf_token %}
				<ul>
                    <li><input type="text" class="form-control" id="name" name="username" placeholder="Имя пользователя" onfocus="this.placeholder = ''" onblur="this.placeholder = 'Имя пользователя'"></li>
					<li><input type="text" class="form-control" id="name" name="email" placeholder="Email пользователя" onfocus="this.placeholder = ''" onblur="this.placeholder = 'Email пользователя'"></li>
                    <li><input type="password" class="form-control" id="name" name="password1" placeholder="Пароль" onfocus="this.placeholder = ''" onblur="this.placeholder = 'Пароль'"></li>
                    <li><input type="password" class="form-control" id="name" name="password2" placeholder="Подтверждение Пароля" onfocus="this.placeholder = ''" onblur="this.placeholder = 'Подтверждение пароля'"></li>
					<li><button type="submit" value="submit" class="button primary fit">Зарегистрироваться</button></li>
				</ul>
                {% if form.errors_to_render %}
                    <div class="alert alert-danger">
                        <ul>
                            {% for item in form.errors_to_render %}
                                <li>{{ item }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
			</form>
		</div>
	</section>
{% endblock %}
