{% extends 'base_template.html' %}
{% load static %}

{% block links %}
	<link rel="stylesheet" href="{% static 'frontend/css/vertical_section.css' %}" />
{% endblock %}

{% block content %}
	<section class="vertical_section">
		<div class="login_form">
			<h2>Смена пароля</h2>
			<form method="post" id="contactForm" novalidate="novalidate">
				{% csrf_token %}
				<ul>
					<li><input type="password" class="form-control" id="name" name="new_password1" placeholder="Новый пароль" onfocus="this.placeholder = ''" onblur="this.placeholder = 'Новый пароль'"></li>
					<li><input type="password" class="form-control" id="name" name="new_password2" placeholder="Подтвердите пароль" onfocus="this.placeholder = ''" onblur="this.placeholder = 'Подтвердите пароль'"></li>
					<li><button type="submit" value="submit" class="button primary fit">Сменить пароль</button></li>
				</ul>
                {% if form.errors_to_render %}
                    <div class="alert alert-danger">
                        <ul>
                            {% for item in form.errors_to_render %}
                                <li>{{ item }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
			</form>
		</div>
	</section>
{% endblock %}
