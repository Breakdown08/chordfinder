{% extends 'base_template.html' %}
{% load static %}

{% block links %}
	<link rel="stylesheet" href="{% static 'frontend/css/vertical_section.css' %}" />
{% endblock %}


{% block content %}
	<section class="vertical_section">
		<div class="login_form">
			<h2>Профиль пользователя {{request.user.username}}</h2>
			<a href="{% url 'password_change_url' %}" class="button small fit">сменить пароль</a>
            <h3>api-key:</h3>
			<textarea readonly name="api-key" id="api-key" placeholder="your api-key" rows="6">{{api_key}}</textarea>
		</div>
	</section>
{% endblock %}
