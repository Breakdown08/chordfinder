[project]
name = "chordfinder"
version = "0.2.0"
description = "Guitar chord recognition (CNN on log-mel spectrograms) served to a Godot web game"
requires-python = ">=3.12,<3.13"
dependencies = [
    # numpy<2: the export group pins TensorFlow 2.16.2, and uv resolves all groups together.
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "librosa==0.10.2.post1",
    "onnxruntime>=1.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
chordfinder = "chordfinder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]
e2e = [
    "playwright>=1.48",
]
# Keras -> ONNX only (`chordfinder export`); never needed at runtime.
export = [
    "tensorflow==2.16.2",
    "keras==3.7.0",
    "tf2onnx>=1.16",
    "onnx>=1.16,<1.18",  # 1.18+ needs ml_dtypes newer than TensorFlow 2.16 allows
]

[tool.uv]
# e2e is default so that `uv sync` gives mypy the Playwright types everywhere; browsers are not downloaded.
default-groups = ["dev", "e2e"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests are slow and need the web build: `uv run pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: Chromium + exported Godot web build"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed (Kirill's rule). mypy --strict covers
# signatures; tests/test_annotations.py covers variables, which no linter checks.
[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["librosa.*", "scipy.*", "onnxruntime.*", "tf2onnx.*", "keras.*", "tensorflow.*"]
ignore_missing_imports = true
