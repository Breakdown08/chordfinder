[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
html/head_include="<script>/* Godot asks getUserMedia({audio:true}): voice processing (AGC, noise suppression, echo cancellation) is on by default and mangles music. Turn it off; ?voice=1 keeps browser defaults for A/B. */(function(){const md=navigator.mediaDevices;if(!md||new URLSearchParams(location.search).has('voice'))return;const orig=md.getUserMedia.bind(md);md.getUserMedia=function(c){if(c&&c.audio===true){c=Object.assign({},c,{audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}return orig(c);};})();/* Godot's worklet interleaves as many input channels as it gets, the engine always reads stereo: a mono mic (Firefox) comes out an octave up at double speed. Force a stereo input so the browser upmixes; ?mono=1 for A/B. */(function(){const W=window.AudioWorkletNode;if(!W||new URLSearchParams(location.search).has('mono'))return;window.AudioWorkletNode=class extends W{constructor(ctx,name,opts){if(name==='godot-processor'){opts=Object.assign({},opts,{channelCount:2,channelCountMode:'explicit',channelInterpretation:'speakers'});}super(ctx,name,opts);}};})();/* Godot only logs a getUserMedia rejection and then captures zeros: keep the error name (NotAllowedError, NotFoundError) for the client to show. */(function(){const md=navigator.mediaDevices;if(!md)return;const orig=md.getUserMedia.bind(md);md.getUserMedia=function(c){return orig(c).catch(function(e){window.cfMicError=e.name;throw e;});};})();</script>"
