[project]
name = "chordfinder"
version = "0.2.0"
description = "Guitar chord recognition (CNN on log-mel spectrograms) served to a Godot web game"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # numpy<2: the export group pins TensorFlow 2.16.2, and uv resolves all groups together.
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "librosa==0.10.2.post1",
    "onnxruntime>=1.19",
]

[project.scripts]
chordfinder = "chordfinder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]
# Keras -> ONNX only (`chordfinder export`); never needed at runtime.
export = [
    "tensorflow==2.16.2",
    "keras==3.7.0",
    "tf2onnx>=1.16",
    "onnx>=1.16,<1.18",  # 1.18+ needs ml_dtypes newer than TensorFlow 2.16 allows
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
